---
# One GitHub App per agent role. Each App's credential (its private key) is readable by the dagu user only,
# in its own directory: /etc/github-app/<agent role>/. No App's files are ever read for another App.
# github_app_group is the dagu user's group (see group_vars/factory.yml).
# Takes github_apps: {<agent role>: {app_id, private_key_file}}.
- name: Fail on an App that is not for a known agent role
  ansible.builtin.assert:
    that: github_apps | list | difference(factory_agent_roles) | length == 0
    fail_msg: "github_apps names {{ github_apps | list | difference(factory_agent_roles) }}, which are not in factory_agent_roles"

- name: Create the credential directory
  ansible.builtin.file:
    path: "{{ github_app_dir }}"
    state: directory
    owner: "{{ dagu_user }}"
    group: "{{ github_app_group }}"
    mode: "0700"

- name: Create each App's credential directory
  ansible.builtin.file:
    path: "{{ github_app_dir }}/{{ item.key }}"
    state: directory
    owner: "{{ dagu_user }}"
    group: "{{ github_app_group }}"
    mode: "0700"
  loop: "{{ github_apps | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Install each App's id
  ansible.builtin.copy:
    content: "{{ item.value.app_id }}\n"
    dest: "{{ github_app_dir }}/{{ item.key }}/app-id"
    owner: "{{ dagu_user }}"
    group: "{{ github_app_group }}"
    mode: "0600"
  loop: "{{ github_apps | dict2items }}"
  loop_control:
    label: "{{ item.key }}/app-id"

- name: Install each App's private key from the controller
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', item.value.private_key_file | expanduser) | trim }}\n"
    dest: "{{ github_app_dir }}/{{ item.key }}/private-key.pem"
    owner: "{{ dagu_user }}"
    group: "{{ github_app_group }}"
    mode: "0600"
  loop: "{{ github_apps | dict2items }}"
  loop_control:
    label: "{{ item.key }}/private-key.pem"
  no_log: true

- name: Remove the single-App credential files this layout replaces
  ansible.builtin.file:
    path: "{{ github_app_dir }}/{{ item }}"
    state: absent
  loop: [app-id, installation-id, private-key.pem]
