---
# The long-lived credential (the app private key) is readable by the dagu user only.
- name: Load GitHub App settings
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/secrets/github_app.yml"
  # Fail closed: a missing file stops the play rather than skipping silently.

- name: Read the private key from the controller
  ansible.builtin.set_fact:
    github_app_private_key: "{{ lookup('ansible.builtin.file', github_app_private_key_file | expanduser) }}"
  no_log: true

- name: Create the credential directory
  ansible.builtin.file:
    path: "{{ github_app_dir }}"
    state: directory
    owner: "{{ dagu_user }}"
    group: "{{ dagu_user }}"
    mode: "0700"

- name: Install the credential files
  ansible.builtin.copy:
    content: "{{ item.content }}\n"
    dest: "{{ github_app_dir }}/{{ item.name }}"
    owner: "{{ dagu_user }}"
    group: "{{ dagu_user }}"
    mode: "0600"
  loop:
    - { name: app-id, content: "{{ github_app_id }}" }
    - { name: installation-id, content: "{{ github_app_installation_id }}" }
    - { name: private-key.pem, content: "{{ github_app_private_key | trim }}" }
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Install the token minting script / git credential helper
  ansible.builtin.copy:
    src: github-app-token
    dest: /usr/local/bin/github-app-token
    owner: root
    group: root
    mode: "0755"

- name: Use the helper for github.com when dagu runs git
  ansible.builtin.copy:
    content: |
      [credential "https://github.com"]
          helper = !/usr/local/bin/github-app-token
    dest: "{{ dagu_home }}/.gitconfig"
    owner: "{{ dagu_user }}"
    group: "{{ dagu_user }}"
    mode: "0644"
