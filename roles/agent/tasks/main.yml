---
# Every host: foreman (poll runs on the server, start and run on the worker) and its config.
- name: Build and install foreman
  ansible.builtin.include_tasks: foreman.yml

# Removed here, not in the github_app role, which runs first: the helper must stay until foreman is installed.
- name: Remove the Python token helper foreman token replaces
  ansible.builtin.file:
    path: /usr/local/bin/github-app-token
    state: absent

- name: Create the agent config directory
  ansible.builtin.file:
    path: /etc/factory-agent
    state: directory
    mode: "0755"

- name: Write the agent config
  ansible.builtin.template:
    src: config.json.j2
    dest: /etc/factory-agent/config.json
    mode: "0644"

# Server: retire the old DAGs first, so the old and new names never run side by side,
# then deploy poll (no model) and one DAG per agent role. The cutover guard (drain.yml) has already run.
- name: Remove the old DAGs from the dagu server
  ansible.builtin.file:
    path: "{{ dagu_home }}/.config/dagu/dags/{{ item }}.yaml"
    state: absent
  loop: "{{ agent_old_dags }}"
  when: dagu_mode == 'server'

- name: Deploy the poll DAG to the dagu server
  ansible.builtin.template:
    src: factory-poll.yaml.j2
    dest: "{{ dagu_home }}/.config/dagu/dags/factory-poll.yaml"
    owner: "{{ dagu_user }}"
    group: "{{ dagu_user }}"
    mode: "0644"
  when: dagu_mode == 'server'

- name: Deploy a DAG per agent role to the dagu server
  ansible.builtin.template:
    src: factory-role.yaml.j2
    dest: "{{ dagu_home }}/.config/dagu/dags/factory-{{ agent_role }}.yaml"
    owner: "{{ dagu_user }}"
    group: "{{ dagu_user }}"
    mode: "0644"
  loop: "{{ factory_agent_roles }}"
  loop_control:
    loop_var: agent_role
  when: dagu_mode == 'server'

- name: Remove the old binary
  ansible.builtin.file:
    path: "{{ agent_old_binary }}"
    state: absent

- name: Set up the agent runner
  when: dagu_mode == 'worker'
  block:
    - name: Load the opencode secrets
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/secrets/opencode.yml"
      no_log: true
      # Fail closed: a missing file stops the play rather than skipping silently.

    - name: Let dagu hand the factory user a token file
      ansible.builtin.user:
        name: "{{ dagu_user }}"
        groups: "{{ factory_user }}"
        append: true
      notify: Restart dagu

    - name: Create the token directory at boot (setgid, so tokens land group-readable by factory)
      ansible.builtin.copy:
        content: "d /run/factory 2750 {{ dagu_user }} {{ factory_user }} -\n"
        dest: /etc/tmpfiles.d/factory-agent.conf
        mode: "0644"
      notify: Create the token directory now

    - name: Allow dagu to run foreman as factory, and nothing else
      ansible.builtin.template:
        src: dagu-agent.sudoers.j2
        dest: /etc/sudoers.d/dagu-agent
        owner: root
        group: root
        mode: "0440"
        validate: visudo -cf %s

    # Enrollment is where an OS the sandbox adapter cannot serve is refused. srt is the only backend,
    # and it uses Seatbelt on macOS and bubblewrap on Linux; the hosts are Linux.
    - name: Fail on a worker host the sandbox cannot serve
      ansible.builtin.assert:
        that:
          - ansible_facts['system'] == 'Linux'
          - ansible_facts['architecture'] in ['aarch64', 'x86_64']
        fail_msg: >-
          the sandbox serves Linux arm64 and amd64 worker hosts only; this host is
          {{ ansible_facts['system'] }}/{{ ansible_facts['architecture'] }}

    - name: Install the pinned sandbox runtime
      ansible.builtin.command: >-
        /nix/var/nix/profiles/default/bin/nix profile add
        --profile /nix/var/nix/profiles/default
        github:NixOS/nixpkgs/{{ factory_nixpkgs_rev }}#sandbox-runtime
        github:NixOS/nixpkgs/{{ factory_nixpkgs_rev }}#bubblewrap
        github:NixOS/nixpkgs/{{ factory_nixpkgs_rev }}#socat
      args:
        creates: /nix/var/nix/profiles/default/bin/srt
      environment:
        PATH: /nix/var/nix/profiles/default/bin:/usr/local/bin:/usr/bin:/bin

    - name: Read the installed sandbox runtime version
      ansible.builtin.command: /nix/var/nix/profiles/default/bin/srt --version
      register: agent_srt_installed
      changed_when: false
      check_mode: false

    - name: Fail on a sandbox runtime other than the pinned version
      ansible.builtin.assert:
        that: agent_srt_installed.stdout | trim == factory_srt_version
        fail_msg: >-
          sandbox runtime {{ agent_srt_installed.stdout | trim }} is installed, but the factory pins
          {{ factory_srt_version }}; update factory_nixpkgs_rev and factory_srt_version together

    - name: Map the CPU architecture to opencode's release naming
      ansible.builtin.set_fact:
        agent_opencode_arch: "{{ {'aarch64': 'arm64', 'x86_64': 'amd64'}[ansible_facts['architecture']] }}"
        agent_opencode_release: "{{ {'aarch64': 'arm64', 'x86_64': 'x64'}[ansible_facts['architecture']] }}"

    - name: Fail on an architecture without a pinned checksum
      ansible.builtin.assert:
        that: agent_opencode_arch in opencode_checksums
        fail_msg: "no opencode checksum pinned for {{ agent_opencode_arch }}; add it to group_vars/factory.yml"

    - name: Read the installed opencode version
      ansible.builtin.command: /usr/local/bin/opencode --version
      register: agent_opencode_installed
      changed_when: false
      failed_when: false # not installed yet is a valid state, handled by the next block
      check_mode: false

    - name: Install opencode
      when: agent_opencode_installed.stdout | default('') | trim != opencode_version
      block:
        - name: Download and verify the opencode release
          ansible.builtin.get_url:
            url: "https://github.com/sst/opencode/releases/download/v{{ opencode_version }}/opencode-linux-{{ agent_opencode_release }}.tar.gz"
            dest: "/tmp/opencode-{{ opencode_version }}-{{ agent_opencode_arch }}.tar.gz"
            checksum: "{{ opencode_checksums[agent_opencode_arch] }}"
            mode: "0600"

        - name: Unpack opencode
          ansible.builtin.unarchive:
            src: "/tmp/opencode-{{ opencode_version }}-{{ agent_opencode_arch }}.tar.gz"
            dest: /tmp
            remote_src: true
            include: [opencode]
          when: not ansible_check_mode # nothing was downloaded to unpack

        - name: Install the opencode binary
          ansible.builtin.copy:
            src: /tmp/opencode
            dest: /usr/local/bin/opencode
            remote_src: true
            owner: root
            group: root
            mode: "0755"
          when: not ansible_check_mode

        - name: Remove download artifacts
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /tmp/opencode
            - "/tmp/opencode-{{ opencode_version }}-{{ agent_opencode_arch }}.tar.gz"
          when: not ansible_check_mode

    - name: Create the factory user's agent directories
      ansible.builtin.file:
        path: "/home/{{ factory_user }}/{{ item.path }}"
        state: directory
        owner: "{{ factory_user }}"
        group: "{{ factory_user }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: .config, mode: "0755" }
        - { path: .config/factory-agent, mode: "0700" }
        - { path: .config/opencode, mode: "0755" }
        - { path: .config/opencode/skills, mode: "0755" }
        - { path: work, mode: "0755" }
      loop_control:
        label: "{{ item.path }}"

    - name: Install the OpenRouter key (factory only)
      ansible.builtin.copy:
        content: "{{ openrouter_api_key }}\n"
        dest: "/home/{{ factory_user }}/.config/factory-agent/openrouter-key"
        owner: "{{ factory_user }}"
        group: "{{ factory_user }}"
        mode: "0400"
      no_log: true

    - name: Configure opencode for unattended runs
      ansible.builtin.template:
        src: opencode.json.j2
        dest: "/home/{{ factory_user }}/.config/opencode/opencode.json"
        owner: "{{ factory_user }}"
        group: "{{ factory_user }}"
        mode: "0644"

    - name: Install the factory's own skills
      ansible.builtin.copy:
        src: skills/
        dest: "/home/{{ factory_user }}/.config/opencode/skills/"
        owner: "{{ factory_user }}"
        group: "{{ factory_user }}"
        mode: "0644"
        directory_mode: "0755"

    - name: Remove the upstream skills clone the factory no longer uses
      ansible.builtin.file:
        path: /opt/mattpocock-skills
        state: absent

    - name: Find the old skill symlinks
      ansible.builtin.find:
        paths: "/home/{{ factory_user }}/.config/opencode/skills"
        file_type: link
      register: agent_skill_links

    - name: Remove each old skill symlink
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ agent_skill_links.files }}"
      loop_control:
        label: "{{ item.path }}"
