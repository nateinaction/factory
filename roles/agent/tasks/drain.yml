---
# Cutover guard, run on the dagu server before anything else changes. It asks
# dagu whether a finances-agent-* run is active and fails the play if one is.
# Drain by suspending finances-agent-poll in the dagu UI, wait for the run to
# finish, then apply again. Nothing here changes a host.
- name: Look for the installed foreman
  ansible.builtin.stat:
    path: /usr/local/bin/foreman
  register: agent_drain_foreman

- name: Look for the dagu binary
  ansible.builtin.stat:
    path: /usr/local/bin/dagu
  register: agent_drain_dagu

- name: Look for the old DAG files
  ansible.builtin.stat:
    path: "{{ dagu_home }}/.config/dagu/dags/{{ item }}.yaml"
  loop: "{{ agent_old_dags }}"
  register: agent_drain_old_dags

# No installed foreman means no foreman has run here, so there is nothing to drain and the first
# deploy to a new host is not blocked. No old DAG on disk means no old run can start.
- name: Fail closed while a finances-agent-* run is active
  ansible.builtin.command:
    argv: "{{ ['/usr/local/bin/foreman', 'drain-check', '--dagu', '/usr/local/bin/dagu'] + agent_drain_present }}"
  become: true
  become_user: "{{ dagu_user }}"
  environment:
    HOME: "{{ dagu_home }}"
  changed_when: false
  check_mode: false # read-only, and the answer matters as much in a dry run
  vars:
    agent_drain_present: "{{ agent_drain_old_dags.results | selectattr('stat.exists') | map(attribute='item') | list }}"
  when:
    - agent_drain_foreman.stat.exists
    - agent_drain_dagu.stat.exists
    - agent_drain_present | length > 0
