---
# Build foreman once per CPU architecture in the play and install it on each host. The cutover guard
# (drain.yml) includes this too, because it needs the new foreman before anything else changes; the
# install is idempotent and does not touch a running DAG.
# Built on the controller, which has the flake's Go toolchain; the binary is static, so the host needs no Go.
# -trimpath and -buildvcs=false keep the build reproducible, so an unchanged tree copies as unchanged.
- name: Gather the CPU architecture
  ansible.builtin.setup:
    gather_subset: [min]

- name: Check that the CPU architecture is supported
  ansible.builtin.assert:
    that: ansible_facts['architecture'] in agent_foreman_goarch_by_arch
    fail_msg: "foreman is not built for {{ ansible_facts['architecture'] }}; supported: {{ agent_foreman_goarch_by_arch | list }}"

# Once per architecture, not once per host: hosts of one architecture would otherwise race on one output path.
- name: Build foreman for each architecture in the play
  ansible.builtin.command:
    argv: [go, build, -trimpath, -buildvcs=false, -o, "{{ playbook_dir }}/.build/foreman-linux-{{ item }}", ./cmd/foreman]
    chdir: "{{ playbook_dir }}/foreman"
  environment:
    GOOS: linux
    GOARCH: "{{ item }}"
    CGO_ENABLED: "0"
  loop: "{{ ansible_play_hosts | map('extract', hostvars, ['ansible_facts', 'architecture']) | unique | map('extract', agent_foreman_goarch_by_arch) | list }}"
  run_once: true
  delegate_to: localhost
  become: false
  changed_when: false # the copy below reports the change
  check_mode: false # the build is local, and the copy needs its output

- name: Install foreman
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/.build/foreman-linux-{{ agent_foreman_goarch_by_arch[ansible_facts['architecture']] }}"
    dest: /usr/local/bin/foreman
    owner: root
    group: root
    mode: "0755"
