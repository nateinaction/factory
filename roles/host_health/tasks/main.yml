---
# Host health on every host: node_exporter supplies memory and filesystem use on loopback, and a
# timer adds the SoC temperature and the firmware's throttling bits, which node_exporter cannot read
# on a Pi. The host's collector scrapes both and forwards them to the telemetry backend.
#
# The nixpkgs revision pins node_exporter's version, as it does the collector's.
- name: Install node_exporter
  ansible.builtin.command: >-
    /nix/var/nix/profiles/default/bin/nix profile add
    --profile /nix/var/nix/profiles/default
    github:NixOS/nixpkgs/{{ factory_nixpkgs_rev }}#prometheus-node-exporter
  args:
    creates: /nix/var/nix/profiles/default/bin/node_exporter
  environment:
    PATH: /nix/var/nix/profiles/default/bin:/usr/local/bin:/usr/bin:/bin

# node_exporter reads the reporter's textfile collector directory; the reporter, not node_exporter,
# writes it, so a failed read leaves the last good file.
- name: Create the textfile collector directory
  ansible.builtin.file:
    path: "{{ factory_host_health_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Built on the controller, which has the flake's Go toolchain; the binary is static, so the host needs no Go.
# -trimpath and -buildvcs=false keep the build reproducible, so an unchanged tree copies as unchanged.
- name: Map the CPU architecture to Go's naming
  ansible.builtin.set_fact:
    host_health_goarch: "{{ {'aarch64': 'arm64', 'x86_64': 'amd64'}[ansible_facts['architecture']] }}"

- name: Build the health reporter for the host
  ansible.builtin.command:
    argv:
      - go
      - build
      - -trimpath
      - -buildvcs=false
      - -o
      - "{{ playbook_dir }}/.build/factory-host-health-linux-{{ host_health_goarch }}"
      - ./roles/host_health/cmd/factory-host-health
    chdir: "{{ playbook_dir }}"
  environment:
    GOOS: linux
    GOARCH: "{{ host_health_goarch }}"
    CGO_ENABLED: "0"
  delegate_to: localhost
  become: false
  changed_when: false # the copy below reports the change
  check_mode: false # the build is local, and the copy needs its output

- name: Install the health reporter
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/.build/factory-host-health-linux-{{ host_health_goarch }}"
    dest: /usr/local/bin/factory-host-health
    owner: root
    group: root
    mode: "0755"

- name: Install node_exporter's unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Install the health reporter's units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [factory-host-health.service, factory-host-health.timer]
  notify: Restart factory host health timer

- name: Enable and start node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Enable and start the health reporter's timer
  ansible.builtin.systemd_service:
    name: factory-host-health.timer
    enabled: true
    state: started
    daemon_reload: true
