---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Map the hostname to 127.0.1.1
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ inventory_hostname }}"

- name: Enable the locale in locale.gen
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^#?\s*{{ factory_locale | regex_escape }}\s'
    line: "{{ factory_locale }} UTF-8"
  notify: Generate locales

# Built on the controller, which has the flake's Go toolchain; the binary is static, so the host needs no Go.
# -trimpath and -buildvcs=false keep the build reproducible, so an unchanged tree copies as unchanged.
- name: Check that the CPU architecture is supported
  ansible.builtin.assert:
    that: ansible_facts['architecture'] in base_goarch_by_arch
    fail_msg: "the login banner is not built for {{ ansible_facts['architecture'] }}; supported: {{ base_goarch_by_arch | list }}"

- name: Map the CPU architecture to Go's naming
  ansible.builtin.set_fact:
    base_goarch: "{{ base_goarch_by_arch[ansible_facts['architecture']] }}"

# Once per architecture, not once per host: hosts of one architecture would otherwise race on one output path.
- name: Build the login banner for each architecture in the play
  ansible.builtin.command:
    argv:
      - go
      - build
      - -trimpath
      - -buildvcs=false
      - -o
      - "{{ playbook_dir }}/.build/factory-status-linux-{{ item }}"
      - ./roles/base/cmd/factory-status
    chdir: "{{ playbook_dir }}"
  environment:
    GOOS: linux
    GOARCH: "{{ item }}"
    CGO_ENABLED: "0"
  loop: "{{ ansible_play_hosts | map('extract', hostvars, 'base_goarch') | unique | list }}"
  run_once: true
  delegate_to: localhost
  become: false
  changed_when: false # the copy below reports the change
  check_mode: false # the build is local, and the copy needs its output

# pam_motd runs every executable in /etc/update-motd.d as root at login, so the binary goes there itself.
- name: Install the login status banner
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/.build/factory-status-linux-{{ base_goarch }}"
    dest: /etc/update-motd.d/20-status
    owner: root
    group: root
    mode: "0755"

- name: Keep the original motd, then empty it (drops the Debian licence text)
  ansible.builtin.copy:
    src: /etc/motd
    dest: /etc/motd.orig
    remote_src: true
    force: false
    mode: "0644"

- name: Empty /etc/motd
  ansible.builtin.copy:
    content: ""
    dest: /etc/motd
    mode: "0644"
