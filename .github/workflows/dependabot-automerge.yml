name: Dependabot automerge
# pull_request_target, because a pull_request run for Dependabot gets a read-only token. Nothing
# here checks out or runs the PR's code, so the elevated token never meets untrusted input.
on: pull_request_target # zizmor: ignore[dangerous-triggers]
permissions: {}
jobs:
  automerge:
    name: enable automerge on Dependabot minor and patch updates
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # Major bumps wait for a human. Auto-merge itself waits for the required checks.
      - name: enable automerge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
