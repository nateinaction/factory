name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # The same hooks the git hook runs, from .pre-commit-config.yaml.
      - name: pre-commit
        run: nix develop --command pre-commit run --all-files
      # Needs the vulnerability database, so it runs in CI rather than the hook.
      - name: govulncheck
        working-directory: foreman
        run: nix develop --command govulncheck ./...
