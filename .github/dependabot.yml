version: 2
updates:
  - package-ecosystem: gomod
    directory: /foreman
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
