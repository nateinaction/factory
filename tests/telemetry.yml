---
# Renders the telemetry role's configs into $RENDER_DIR with the real group_vars, so
# tests/telemetry.test can assert on them without a host. Grafana's config is rendered by the role's
# own task, so the test also sees its password guard and the mode it installs.
- name: Render the telemetry backend config
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/factory.yml
  vars:
    render_dir: "{{ lookup('env', 'RENDER_DIR') }}"
  tasks:
    # First, so an unset admin password fails the play before anything is written. The path, owner
    # and group point into the temporary tree, as the current user; the mode stays the role's own.
    - name: Render Grafana's config through the role's task
      ansible.builtin.include_role:
        name: telemetry
        tasks_from: grafana
      vars:
        telemetry_grafana_config_path: "{{ render_dir }}/grafana.ini"
        telemetry_grafana_config_owner: "{{ lookup('env', 'RENDER_OWNER') }}"
        telemetry_grafana_config_group: "{{ lookup('env', 'RENDER_GROUP') }}"

    - name: Render each template
      ansible.builtin.template:
        src: "../roles/telemetry/templates/{{ item }}.j2"
        dest: "{{ render_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - prometheus.service
        - prometheus.yaml
        - tempo.service
        - loki.service
        - grafana.service
        - tempo.yaml
        - loki.yaml
        - datasources.yaml

    - name: Read the YAML back
      ansible.builtin.slurp:
        src: "{{ render_dir }}/{{ item }}"
      loop: [tempo.yaml, loki.yaml, datasources.yaml]
      register: telemetry_rendered

    # The test's python has no YAML parser; hand it JSON.
    - name: Write the configs and the vars as JSON
      ansible.builtin.copy:
        content: "{{ {'tempo': tempo, 'loki': loki, 'datasources': datasources, 'v': v} | to_json }}"
        dest: "{{ render_dir }}/config.json"
        mode: "0644"
      vars:
        tempo: "{{ telemetry_rendered.results[0].content | b64decode | from_yaml }}"
        loki: "{{ telemetry_rendered.results[1].content | b64decode | from_yaml }}"
        datasources: "{{ telemetry_rendered.results[2].content | b64decode | from_yaml }}"
        v:
          factory_telemetry_memory_budget_mib: "{{ factory_telemetry_memory_budget_mib }}"
          factory_telemetry_memory_max_mib: "{{ factory_telemetry_memory_max_mib }}"
          factory_telemetry_tempo_otlp_port: "{{ factory_telemetry_tempo_otlp_port }}"
          factory_telemetry_grafana_admin_user: "{{ factory_telemetry_grafana_admin_user }}"
          factory_telemetry_grafana_admin_password: "{{ factory_telemetry_grafana_admin_password }}"

    # The role notifies a Grafana restart from its config task, and this test has no systemd to
    # restart. Ending the play here leaves the handler unrun; every assertion is already done.
    - name: End the play before handlers
      ansible.builtin.meta: end_play
