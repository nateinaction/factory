---
# Renders the host health configs into $RENDER_DIR with the real group_vars, so
# tests/host_health.test can assert on them without a host. The collector's host.name is the
# inventory name here, which is what base.yml sets the OS hostname to on a host.
- name: Render the host health config and dashboard
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/factory.yml
  vars:
    render_dir: "{{ lookup('env', 'RENDER_DIR') }}"
    # The test inventory has no dagu_server group; the collector renders against a named backend.
    factory_collector_backend_host: telemetry.example
  tasks:
    - name: Render the collector config
      ansible.builtin.template:
        src: ../roles/collector/templates/config.yaml.j2
        dest: "{{ render_dir }}/collector.yaml"
        mode: "0644"

    - name: Render the host health units
      ansible.builtin.template:
        src: "../roles/host_health/templates/{{ item }}.j2"
        dest: "{{ render_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - node_exporter.service
        - factory-host-health.service
        - factory-host-health.timer

    - name: Render the Grafana dashboard provider
      ansible.builtin.template:
        src: ../roles/telemetry/templates/dashboards.yaml.j2
        dest: "{{ render_dir }}/dashboards.yaml"
        mode: "0644"

    - name: Render the host health dashboard
      ansible.builtin.template:
        src: ../roles/telemetry/templates/host-health.json.j2
        dest: "{{ render_dir }}/host-health.json"
        mode: "0644"

    - name: Render Prometheus's config
      ansible.builtin.template:
        src: ../roles/telemetry/templates/prometheus.yaml.j2
        dest: "{{ render_dir }}/prometheus.yaml"
        mode: "0644"

    - name: Read the rendered files back
      ansible.builtin.slurp:
        src: "{{ render_dir }}/{{ item }}"
      loop: [collector.yaml, host-health.json, prometheus.yaml]
      register: health_rendered

    # The test's python has no YAML parser; hand it JSON.
    - name: Write the configs and the vars as JSON
      ansible.builtin.copy:
        content: "{{ {'collector': collector, 'dashboard': dashboard, 'prometheus': prometheus, 'v': v} | to_json }}"
        dest: "{{ render_dir }}/config.json"
        mode: "0644"
      vars:
        collector: "{{ health_rendered.results[0].content | b64decode | from_yaml }}"
        dashboard: "{{ health_rendered.results[1].content | b64decode | from_json }}"
        prometheus: "{{ health_rendered.results[2].content | b64decode | from_yaml }}"
        v:
          factory_collector_allowed_attributes: "{{ factory_collector_allowed_attributes }}"
          factory_host_health_port: "{{ factory_host_health_port }}"
          factory_telemetry_run_span: "{{ factory_telemetry_run_span }}"
