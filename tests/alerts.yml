---
# Renders the alert rules into $RENDER_DIR with the real group_vars, so tests/alerts.test can check
# them and fire each one from a synthetic event without a host.
- name: Render the alert rules
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/factory.yml
  vars:
    render_dir: "{{ lookup('env', 'RENDER_DIR') }}"
  tasks:
    - name: Render the Prometheus alert rules
      ansible.builtin.template:
        src: ../roles/telemetry/templates/alerts.yaml.j2
        dest: "{{ render_dir }}/alerts.yaml"
        mode: "0644"

    - name: Read the rules back
      ansible.builtin.slurp:
        src: "{{ render_dir }}/alerts.yaml"
      register: alerts_rendered

    # The test's python has no YAML parser; hand it JSON.
    - name: Write the rules and the thresholds as JSON
      ansible.builtin.copy:
        content: "{{ {'groups': (alerts_rendered.content | b64decode | from_yaml).groups, 'v': v} | to_json }}"
        dest: "{{ render_dir }}/rules.json"
        mode: "0644"
      vars:
        v:
          factory_alerts_security_window: "{{ factory_alerts_security_window }}"
          factory_alerts_dead_run_window: "{{ factory_alerts_dead_run_window }}"
          factory_alerts_failure_rate_window: "{{ factory_alerts_failure_rate_window }}"
          factory_alerts_failure_rate_threshold: "{{ factory_alerts_failure_rate_threshold }}"
          factory_alerts_failure_rate_min_runs: "{{ factory_alerts_failure_rate_min_runs }}"
          factory_alerts_cost_window: "{{ factory_alerts_cost_window }}"
          factory_alerts_daily_cost_budget_usd: "{{ factory_alerts_daily_cost_budget_usd }}"
          factory_alerts_grafana_url: "{{ factory_alerts_grafana_url }}"
