---
# Copy to secrets/github_app.yml (gitignored) and fill in.
# One GitHub App per agent role, named <owner>-factory-<agent role> (at most 34 characters).
# List only the agent roles whose Apps you have created: the factory works a repository
# for the agent roles whose Apps are installed on it, and installing any of them assigns it.
github_apps:
  implementer:
    app_id: "123456"
    # Path on the machine running ansible. Read at run time, never copied into the repo.
    private_key_file: ~/.config/factory/nateinaction-factory-implementer.pem
  reviewer:
    app_id: "123457"
    private_key_file: ~/.config/factory/nateinaction-factory-reviewer.pem
