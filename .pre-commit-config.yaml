# One definition of the repo's checks, shared by the git hook, CI and manual
# runs (`pre-commit run --all-files`). The repo's own checks use the tools from the Nix dev shell,
# so those hooks are `language: system`; the stock hooks below are fetched and pinned by pre-commit.
#
# A hook that changes a file fails the run, which keeps the old "go fix and
# go mod tidy must leave the tree alone" behavior.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files

  - repo: local
    hooks:
      # Scans what is staged for a commit, so a secret is stopped before it reaches history; CI scans
      # the history too. It runs on every commit, not only when a Go or YAML file changes.
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        always_run: true
        pass_filenames: false

      - id: go-fix
        name: go fix
        entry: bash -c 'cd foreman && go fix ./...'
        language: system
        files: ^foreman/.*\.go$
        pass_filenames: false

      - id: go-mod-tidy
        name: go mod tidy
        entry: bash -c 'cd foreman && go mod tidy'
        language: system
        files: ^foreman/(go\.mod|go\.sum|.*\.go)$
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'cd foreman && golangci-lint run ./...'
        language: system
        files: ^foreman/.*\.go$
        pass_filenames: false

      # golangci-lint's unused sees one package at a time. deadcode follows calls from main and the
      # tests across packages, and exits 0 even when it finds something, so any output fails the hook.
      - id: deadcode
        name: deadcode
        entry: bash -c 'cd foreman && out=$(go tool deadcode -test ./...) && [ -z "$out" ] || { echo "$out"; exit 1; }'
        language: system
        files: ^foreman/(go\.mod|go\.sum|.*\.go)$
        pass_filenames: false

      - id: go-test
        name: go test (ginkgo)
        entry: bash -c 'cd foreman && go tool ginkgo -r -p --race --randomize-all --fail-on-pending --fail-on-empty --keep-going'
        language: system
        files: ^foreman/.*\.go$
        pass_filenames: false

      - id: ansible-syntax
        name: ansible syntax check
        entry: ansible-playbook --syntax-check site.yml
        language: system
        files: ^(site\.yml|ansible\.cfg|(roles|group_vars|inventory|tests)/.*\.ya?ml)$
        pass_filenames: false

      - id: ansible-lint
        name: ansible-lint
        entry: ansible-lint
        language: system
        files: ^(site\.yml|ansible\.cfg|\.ansible-lint|\.yamllint|(roles|group_vars|inventory|tests)/.*\.ya?ml)$
        pass_filenames: false

      - id: yamllint
        name: yamllint
        entry: yamllint .
        language: system
        files: \.ya?ml$|^\.yamllint$
        pass_filenames: false

      - id: ansible-test
        name: ansible tests
        entry: bash -c 'set -euo pipefail; for t in tests/*.test; do echo "== $t"; "$t"; done'
        language: system
        files: ^(roles/|tests/|group_vars/|inventory/|site\.yml|ansible\.cfg)
        pass_filenames: false
