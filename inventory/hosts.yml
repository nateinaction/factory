all:
  children:
    factory:
      vars:
        # Bootstrap admin: must exist already, with SSH key login and passwordless sudo.
        ansible_user: ngay
      hosts:
        factory-1:
          ansible_host: 100.72.120.44
        factory-2:
          ansible_host: 100.69.215.5
    # factory-1 (2GB) runs the dagu UI, scheduler and coordinator. factory-2 (8GB)
    # runs a worker that executes the scheduled work.
    dagu_server:
      hosts:
        factory-1:
    dagu_worker:
      hosts:
        factory-2:
