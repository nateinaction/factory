# Builds the golangci-lint binary the repo runs, with nilaway added as a module plugin
# (`golangci-lint custom`). nilaway is not a built-in linter because it can report false positives.
# The golangci-lint version must match the one in flake.lock's nixpkgs.
version: v2.15.0
name: custom-gcl
destination: ../.build
plugins:
  - module: go.uber.org/nilaway
    import: go.uber.org/nilaway/cmd/gclplugin
    # nilaway publishes no tags: this is a commit, so the build is reproducible.
    version: acb8859b9031bb9496be97e027df5573f9fb5340
