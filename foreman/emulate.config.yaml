# Seed for the GitHub emulator foreman's tests run against (vercel-labs/emulate).
#
# Tests create and delete their own repository through the API, so only the users and the
# tokens the fake `github-app-token` helper mints live here. The login behind a token is
# what `expectAuthorizedAs` asserts on, and what the emulator attributes writes to.
tokens:
  # Admin token: creates and deletes the per-spec repository. Tests call it directly,
  # never through the recording proxy, so setup does not pollute request assertions.
  admin-token:
    login: o
    scopes:
      - repo
      - user
  # The Reviewer's token file in the flow tests (`writeToken(Reviewer, ...)`).
  repo-token:
    login: factory
    scopes:
      - repo
  secret-token:
    login: factory
    scopes:
      - repo
  # Tokens the fake `github-app-token` helper mints, one per agent role.
  minted-token-planner:
    login: factory-planner
    scopes:
      - repo
  minted-token-researcher:
    login: factory-researcher
    scopes:
      - repo
  minted-token-implementer:
    login: factory-implementer
    scopes:
      - repo
  minted-token-reviewer:
    login: factory-reviewer
    scopes:
      - repo

github:
  users:
    - login: o
      name: Repository Owner
    - login: factory
      name: Factory
    - login: factory-planner
      name: Factory Planner
    - login: factory-researcher
      name: Factory Researcher
    - login: factory-implementer
      name: Factory Implementer
    - login: factory-reviewer
      name: Factory Reviewer
